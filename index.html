<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LICENSEGOC™ — GLOBAL CREATION OS</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

.hero{
  min-height:100vh;
  padding:26px 18px 120px;
  background:
    linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.82)),
    url("creations-bg.jpg") center/cover no-repeat;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.logo{
  font-size:42px;
  font-weight:1000;
  color:#f1c76b;
  text-shadow:0 0 34px rgba(241,199,107,.45);
}

.tagline{
  max-width:760px;
  margin:16px auto 28px;
  color:#f5dfad;
  line-height:1.6;
  font-size:15px;
  letter-spacing:.6px;
}

.enter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:58px;
  padding:0 30px;
  border-radius:999px;
  background:linear-gradient(180deg,#f1c76b,#d89c31);
  color:#171006;
  font-weight:1000;
  text-decoration:none;
  box-shadow:0 18px 48px rgba(241,199,107,.28);
}

.modules{
  width:min(980px,94%);
  margin:30px auto 0;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
}

.modules a{
  min-height:86px;
  border-radius:22px;
  border:1px solid rgba(241,199,107,.18);
  background:rgba(5,10,18,.72);
  backdrop-filter:blur(16px);
  color:#f7dfaa;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:1000;
  letter-spacing:.4px;
}

.modules span{
  font-size:24px;
  margin-bottom:7px;
}

.translate-btn{
  position:fixed;
  top:16px;
  right:16px;
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  background:linear-gradient(180deg,#f1c76b,#d89c31);
  color:#000;
  font-size:22px;
  cursor:pointer;
  z-index:9999;
  box-shadow:0 12px 30px rgba(241,199,107,.25);
}

.translate-box{
  position:fixed;
  top:76px;
  right:16px;
  display:none;
  background:rgba(0,0,0,.92);
  border:1px solid rgba(241,199,107,.25);
  border-radius:16px;
  padding:12px;
  z-index:9999;
}

.bottom-dock{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  width:min(760px,92%);
  min-height:74px;
  padding:10px;
  border-radius:30px;
  background:rgba(5,10,18,.86);
  border:1px solid rgba(241,199,107,.18);
  backdrop-filter:blur(18px);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  z-index:1000;
}

.bottom-dock a{
  color:#f4dfb5;
  text-decoration:none;
  font-size:11px;
  font-weight:900;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:20px;
}

.bottom-dock span{
  font-size:22px;
  margin-bottom:4px;
}

.goog-te-banner-frame.skiptranslate{display:none!important}
body{top:0!important}

@media(max-width:560px){
  .logo{font-size:34px}
  .tagline{font-size:13px}
  .modules{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<button class="translate-btn" onclick="toggleTranslate()">🌍</button>
<div id="google_translate_element" class="translate-box"></div>

<main class="hero">

  <div class="logo">LICENSEGOC™</div>

  <div class="tagline">
    IN GOD WE TRUST • GLOBAL AI • COPYRIGHT • OWNERSHIP • COMMERCIAL • ENTERTAINMENT • FUTURE ECONOMY
  </div>

  <a class="enter" href="creationsroom.html">ENTER CREATIONS ROOM →</a>

  <section class="modules">
    <a href="creationsroom.html"><span>🧩</span>CREATIONS ROOM</a>
    <a href="licensecoin.html"><span>🪙</span>LICENSECOIN ENGINE</a>
    <a href="commercial.html"><span>💼</span>COMMERCIAL</a>
    <a href="entertainment.html"><span>🎬</span>ENTERTAINMENT</a>
    <a href="ownership.html"><span>📜</span>OWNERSHIP</a>
    <a href="uspto.html"><span>⚖️</span>USPTO</a>
    <a href="investor-snapshot.html"><span>💼</span>INVESTOR</a>
    <a href="globalroom.html"><span>🌍</span>GLOBAL ROOM</a>
    <a href="ai-command.html"><span>🤖</span>AI TIM</a>
    <a href="system-map.html"><span>♥</span>SYSTEM MAP</a>
  </section>

</main>

<nav class="bottom-dock">
  <a href="index.html"><span>⌂</span>HOME</a>
  <a href="creationsroom.html"><span>🧩</span>ROOM</a>
  <a href="licensecoin.html"><span>🪙</span>COIN</a>
  <a href="commercial.html"><span>💼</span>COMMERCIAL</a>
  <a href="system-map.html"><span>♥</span>MAP</a>
</nav>

<script>
function toggleTranslate(){
  const box=document.getElementById("google_translate_element");
  box.style.display=box.style.display==="block"?"none":"block";
}

function googleTranslateElementInit(){
  new google.translate.TranslateElement({
    pageLanguage:"vi",
    includedLanguages:"en,vi,zh-CN,zh-TW,ja,ko,fr,de,es,it,ru,ar",
    layout:google.translate.TranslateElement.InlineLayout.SIMPLE
  },"google_translate_element");
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
