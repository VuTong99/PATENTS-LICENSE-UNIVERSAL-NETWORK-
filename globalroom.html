<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOBAL CREATIONS ROOM™ — LICENSEGOC</title>

<style>
:root{
  --line:rgba(255,255,255,.1);
  --gold:#f1c76b;
  --green:#71f0ad;
  --cyan:#7ae7ff;
  --muted:rgba(255,255,255,.7);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle,#071326,#020814);
  color:#fff;
}
.container{
  max-width:1150px;
  margin:auto;
  padding:18px;
  padding-bottom:90px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;
}
.logo{
  color:var(--gold);
  font-weight:1000;
}
.grid{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:16px;
  margin-top:16px;
}
.card{
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  background:rgba(255,255,255,.05);
  margin-bottom:16px;
}
.project-card{
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  background:rgba(255,255,255,.045);
  margin-bottom:12px;
  cursor:pointer;
}
.project-card:hover{
  background:rgba(255,255,255,.08);
}
.project-card b{
  color:#fff;
}
.stat{
  font-size:13px;
  color:var(--muted);
  margin-top:6px;
}
.badge{
  display:inline-block;
  margin-top:8px;
  padding:4px 8px;
  border-radius:999px;
  background:rgba(241,199,107,.12);
  color:var(--gold);
  font-size:12px;
  font-weight:900;
}
.feature{
  min-height:360px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
}
.feature img{
  width:100%;
  max-height:260px;
  object-fit:contain;
  border-radius:16px;
  margin-top:12px;
}
.btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:1000;
}
.gold{background:var(--gold);color:#000}
.dark{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
.feed{
  max-height:260px;
  overflow:auto;
  font-size:13px;
  line-height:1.6;
}
.search{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#09111f;
  color:#fff;
}
.big{
  font-size:34px;
  font-weight:1000;
  color:var(--gold);
}
@media(max-width:820px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <div class="logo">🌍 GLOBAL CREATIONS ROOM™</div>
    <div id="online">0 Global Online</div>
  </div>

  <div class="grid">

    <aside>
      <div class="card">
        <input id="search" class="search" placeholder="Search project..." oninput="renderProjects()">
      </div>

      <div class="card">
        <h3>🔥 Trending Projects</h3>
        <div id="trendingList"></div>
      </div>

      <div class="card">
        <h3>📡 Global Feed</h3>
        <div id="feed" class="feed"></div>
      </div>
    </aside>

    <main>
      <div class="card feature" id="featureBox">
        <h2>CREATIONS ROOM™ GLOBAL</h2>
        <p>Chọn project để xem tín hiệu toàn cầu.</p>
      </div>

      <div class="card">
        <h3>📊 Global Signal</h3>
        <div class="stat">Public Attention</div>
        <div class="big" id="attention">0%</div>

        <div class="stat">Investor Signal: <b id="investor">LOW</b></div>
        <div class="stat">Patent Readiness: <b id="patent">0%</b></div>

        <button class="btn dark" onclick="likeProject()">❤️ Like</button>
        <button class="btn dark" onclick="watchProject()">👁 Watch</button>
        <button class="btn gold" onclick="openHub()">🧠 Open Project Hub</button>
      </div>

      <div class="card">
        <h3>🤖 Tim ♥️ Global Read</h3>
        <button class="btn gold" onclick="globalAI()">Analyze Global Value</button>
        <div id="aiOutput" class="feed"></div>
      </div>
    </main>

  </div>

</div>

<script>
let projects = JSON.parse(localStorage.getItem("projects") || "[]");
let currentIndex = 0;

if(projects.length === 0){
  projects = [
    {
      id:"GOC-DEMO1",
      name:"Quantum Hover Engine",
      category:"Vehicle",
      idea:"Future propulsion system for clean vehicles.",
      problem:"Current engines waste energy.",
      solution:"Adaptive hover propulsion.",
      status:"Draft",
      owner:"GỐC",
      progress:42,
      likes:128,
      watchers:44,
      image:"",
      created:new Date().toLocaleString()
    },
    {
      id:"GOC-DEMO2",
      name:"AI Patent Shield",
      category:"AI Legal",
      idea:"AI legal assistant for invention protection.",
      problem:"Inventors do not understand patent filing.",
      solution:"Guided AI preparation flow.",
      status:"Protected",
      owner:"GỐC",
      progress:64,
      likes:98,
      watchers:31,
      image:"",
      created:new Date().toLocaleString()
    },
    {
      id:"GOC-DEMO3",
      name:"2070 Smart Room",
      category:"Future Living",
      idea:"Interactive future bedroom and work environment.",
      problem:"Static spaces cannot adapt to humans.",
      solution:"AI-driven spatial interface.",
      status:"Published",
      owner:"GỐC",
      progress:77,
      likes:76,
      watchers:22,
      image:"",
      created:new Date().toLocaleString()
    }
  ];
  localStorage.setItem("projects",JSON.stringify(projects));
}

function save(){
  localStorage.setItem("projects",JSON.stringify(projects));
}

function score(p){
  return (p.likes || 0) * 2 + (p.watchers || 0) + (p.progress || 0);
}

function renderProjects(){
  const q = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("trendingList");
  list.innerHTML = "";

  const filtered = projects
    .map((p,i)=>({...p,_index:i}))
    .filter(p => (p.name || "").toLowerCase().includes(q))
    .sort((a,b)=>score(b)-score(a));

  filtered.forEach(p=>{
    list.innerHTML += `
      <div class="project-card" onclick="loadProject(${p._index})">
        <b>${p.name || "Untitled Project"}</b>
        <div class="stat">${p.category || "General"} • ${p.status || "Draft"}</div>
        <div class="stat">❤️ ${p.likes || 0} • 👁 ${p.watchers || 0} • ${p.progress || 0}%</div>
        <span class="badge">Trending</span>
      </div>
    `;
  });
}

function loadProject(i){
  currentIndex = i;
  localStorage.setItem("openProjectIndex", i);

  const p = projects[i];

  featureBox.innerHTML = `
    <h2>${p.name || "Untitled Project"}</h2>
    <p>${p.idea || "No idea description yet."}</p>
    ${p.image ? `<img src="${p.image}">` : ""}
    <div class="stat">Ghost ID: ${p.id || "—"}</div>
    <div class="stat">Owner: ${p.owner || "Unknown"}</div>
    <span class="badge">${p.status || "Draft"}</span>
  `;

  updateSignals();
  addFeed("Opened project: " + (p.name || "Untitled Project"));
}

function updateSignals(){
  const p = projects[currentIndex];
  const attentionScore = Math.min(99,(p.likes||0)+(p.watchers||0)+(p.progress||0));
  const patentScore = Math.min(95,30+(p.problem?20:0)+(p.solution?25:0)+(p.image?10:0)+(p.status==="Protected"?10:0));

  attention.innerText = attentionScore + "%";
  patent.innerText = patentScore + "%";
  investor.innerText = attentionScore > 130 ? "VERY HIGH" : attentionScore > 85 ? "HIGH" : attentionScore > 45 ? "MEDIUM" : "LOW";
}

function addFeed(msg){
  feed.innerHTML = "<div>• " + msg + "</div>" + feed.innerHTML;
}

function likeProject(){
  projects[currentIndex].likes = (projects[currentIndex].likes || 0) + 1;
  save();
  renderProjects();
  loadProject(currentIndex);
}

function watchProject(){
  projects[currentIndex].watchers = (projects[currentIndex].watchers || 0) + 1;
  save();
  renderProjects();
  loadProject(currentIndex);
}

function openHub(){
  localStorage.setItem("openProjectIndex", currentIndex);
  window.location.href = "project-hub.html";
}

function globalAI(){
  const p = projects[currentIndex];
  aiOutput.innerHTML =
    "Tim ♥️: Project <b>" + (p.name || "Untitled") + "</b> đang có tín hiệu công khai. Bước mạnh nhất tiếp theo là hoàn thiện hình proof, problem/solution, USPTO readiness và ownership certificate.";
}

const names=["Alex","Diane","Michael","Sophie","Ken","Maria","Robert","Emily"];

setInterval(()=>{
  online.innerText = Math.floor(Math.random()*900+300) + " Global Online";
},2000);

setInterval(()=>{
  const p = projects[Math.floor(Math.random()*projects.length)];
  const n = names[Math.floor(Math.random()*names.length)];
  addFeed(n + " viewed " + (p.name || "a project"));
},3500);

renderProjects();
loadProject(0);
</script>

<script src="nav.js"></script>
</body>
</html>
