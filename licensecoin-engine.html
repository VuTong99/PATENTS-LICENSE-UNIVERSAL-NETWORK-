<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LICENSECOIN ENGINE™ — LICENSEGOC</title>

<style>
:root{
  --line:rgba(255,255,255,.1);
  --gold:#f1c76b;
  --green:#71f0ad;
  --cyan:#7ae7ff;
  --muted:rgba(255,255,255,.7);
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle,#071326,#020814);
  color:#fff;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
  padding-bottom:100px;
}
.card{
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  background:rgba(255,255,255,.05);
  margin-bottom:16px;
}
h1{color:var(--gold)}
.stat{color:var(--muted);margin-top:6px}
.big{
  font-size:34px;
  font-weight:1000;
  color:var(--gold);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:1000;
  cursor:pointer;
}
.gold{background:var(--gold);color:#000}
.dark{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
input{
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#09111f;
  color:#fff;
}
@media(max-width:760px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<h1>🪙 LICENSECOIN ENGINE™</h1>

<div class="card">
  <h2 id="name">Project</h2>
  <div class="stat" id="category"></div>
</div>

<div class="grid">

<div class="card">
  <h3>📊 Value Engine</h3>
  <div class="stat">Estimated Value</div>
  <div class="big" id="value">$0</div>

  <div class="stat">Market Strength</div>
  <div class="big" id="market">0%</div>

  <div class="stat">Investor Signal</div>
  <div class="big" id="investor">LOW</div>

  <button class="btn gold" onclick="mint()">⚡ Mint LICENSECOIN</button>
</div>

<div class="card">
  <h3>💰 Investor Entry</h3>

  <input id="amount" placeholder="Investment Amount ($)">
  <button class="btn dark" onclick="invest()">Invest</button>

  <div class="stat" id="investLog"></div>
</div>

</div>

<div class="card">
  <h3>🧠 Tim ♥️ Financial Analysis</h3>
  <div class="stat" id="analysis"></div>
</div>

<div class="card">
  <h3>🚀 Navigation</h3>
  <button class="btn dark" onclick="goHub()">🧩 Project Hub</button>
  <button class="btn dark" onclick="goOwner()">📜 Ownership</button>
  <button class="btn dark" onclick="goUSPTO()">⚖️ USPTO</button>
  <button class="btn gold" onclick="goGlobal()">🌍 Global</button>
</div>

</div>

<script>
let projects = JSON.parse(localStorage.getItem("projects") || "[]");
let index = Number(localStorage.getItem("openProjectIndex") || 0);
let p = projects[index];

if(!p){
  document.getElementById("name").innerText = "No Project Found";
}else{
  render();
}

function save(){
  localStorage.setItem("projects", JSON.stringify(projects));
}

function render(){
  name.innerText = p.name || "Untitled";
  category.innerText = p.category || "";

  let val = calcValue();
  let marketScore = calcMarket();

  value.innerText = "$" + val.toLocaleString();
  market.innerText = marketScore + "%";
  investor.innerText =
    marketScore > 120 ? "VERY HIGH" :
    marketScore > 80 ? "HIGH" :
    marketScore > 50 ? "MEDIUM" : "LOW";

  analysis.innerText =
    "Tim ♥️: Giá trị project phụ thuộc mạnh vào solution + ownership + traction. Tăng like, watcher và hoàn thiện patent sẽ đẩy value lên nhanh.";
}

function calcValue(){
  let v = 1000;

  if(p.idea) v += 3000;
  if(p.problem) v += 3000;
  if(p.solution) v += 5000;
  if(p.image) v += 2000;
  if(p.status === "Protected") v += 15000;
  if(p.ownershipLocked) v += 10000;

  v += (p.likes || 0) * 50;
  v += (p.watchers || 0) * 30;

  return v;
}

function calcMarket(){
  let s = 20;
  if(p.idea) s += 20;
  if(p.solution) s += 30;
  if(p.status === "Protected") s += 20;
  if(p.ownershipLocked) s += 20;
  s += Math.min((p.likes || 0), 50);

  return s;
}

function mint(){
  p.coinMinted = true;
  p.coinValue = calcValue();
  save();
  alert("LICENSECOIN minted based on project value.");
}

function invest(){
  let amount = Number(document.getElementById("amount").value);
  if(!amount) return alert("Nhập số tiền.");

  if(!p.investments) p.investments = [];
  p.investments.push({
    amount:amount,
    time:new Date().toLocaleString()
  });

  p.totalInvestment = (p.totalInvestment || 0) + amount;

  save();
  document.getElementById("investLog").innerText =
    "Total Investment: $" + p.totalInvestment.toLocaleString();
}

function goHub(){
  window.location.href="project-hub.html";
}
function goOwner(){
  window.location.href="ownership.html";
}
function goUSPTO(){
  window.location.href="uspto.html";
}
function goGlobal(){
  window.location.href="globalroom.html";
}
</script>
<script src="sync.js"></script>
<script src="nav.js"></script>
</body>
</html>
