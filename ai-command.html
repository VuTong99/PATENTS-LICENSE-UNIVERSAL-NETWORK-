<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI COMMAND CENTER™ — LICENSEGOC</title>

<style>
:root{
  --line:rgba(255,255,255,.1);
  --gold:#f1c76b;
  --cyan:#7ae7ff;
  --muted:rgba(255,255,255,.7);
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle,#071326,#020814);
  color:#fff;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
  padding-bottom:100px;
}
.card{
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  background:rgba(255,255,255,.05);
  margin-bottom:16px;
}
h1{color:var(--gold)}
h2{margin-bottom:10px}
.stat{color:var(--muted);margin-top:6px;line-height:1.6}
.output{
  white-space:pre-wrap;
  margin-top:12px;
  padding:12px;
  background:#09111f;
  border-radius:12px;
}
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:1000;
  cursor:pointer;
}
.gold{background:var(--gold);color:#000}
.dark{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
@media(max-width:800px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 AI COMMAND CENTER™</h1>

<div class="card">
  <h2 id="name">Project</h2>
  <div class="stat" id="idea"></div>
</div>

<div class="grid">

<div class="card">
  <h2>🧠 AI Analysis</h2>
  <button class="btn gold" onclick="analyze()">Run Full Analysis</button>
  <div id="analysis" class="output"></div>
</div>

<div class="card">
  <h2>📋 Master Build Orders</h2>
  <button class="btn gold" onclick="buildOrders()">Generate Orders</button>
  <div id="orders" class="output"></div>
</div>

</div>

<div class="card">
  <h2>🚀 Navigation</h2>
  <button class="btn dark" onclick="goHub()">🧩 Project Hub</button>
  <button class="btn dark" onclick="goUSPTO()">⚖️ USPTO</button>
  <button class="btn dark" onclick="goOwner()">📜 Ownership</button>
  <button class="btn dark" onclick="goCoin()">🪙 Coin</button>
  <button class="btn gold" onclick="goGlobal()">🌍 Global</button>
</div>

</div>

<script>
let projects = JSON.parse(localStorage.getItem("projects")||"[]");
let index = Number(localStorage.getItem("openProjectIndex")||0);
let p = projects[index];

if(p){
  name.innerText = p.name || "Untitled Project";
  idea.innerText = p.idea || "";
}else{
  name.innerText = "No Project Found";
}

function analyze(){
  if(!p) return;

  let text = "";

  text += "IDEA ANALYSIS:\n";
  text += p.idea ? "✔ Clear concept\n" : "✖ Missing idea\n";

  text += "\nPROBLEM:\n";
  text += p.problem ? "✔ Defined problem\n" : "✖ Weak problem\n";

  text += "\nSOLUTION:\n";
  text += p.solution ? "✔ Technical direction exists\n" : "✖ Missing mechanism\n";

  text += "\nLEGAL (USPTO):\n";
  text += p.solution ? "Potential Utility Patent\n" : "Needs structure\n";

  text += "\nMARKET:\n";
  text += (p.likes||0) > 50 ? "High traction\n" : "Low traction\n";

  analysis.innerText = text;
}

function buildOrders(){
  if(!p) return;

  let text = "";

  text += "MASTER BUILD ORDERS:\n\n";

  text += "1. IDEA → Refine clarity and uniqueness\n";
  text += "2. DESIGN → Create blueprint + visual proof\n";
  text += "3. PATENT → Expand claims + USPTO draft\n";
  text += "4. OWNERSHIP → Lock ownership + members\n";
  text += "5. VALUE → Increase traction (likes/watchers)\n";
  text += "6. COIN → Mint LICENSECOIN\n";
  text += "7. GLOBAL → Push exposure\n";

  orders.innerText = text;
}

function goHub(){location.href="project-hub.html";}
function goUSPTO(){location.href="uspto.html";}
function goOwner(){location.href="ownership.html";}
function goCoin(){location.href="licensecoin-engine.html";}
function goGlobal(){location.href="globalroom.html";}
</script>

<script src="nav.js"></script>

</body>
</html>
