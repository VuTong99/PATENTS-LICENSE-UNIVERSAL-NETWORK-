<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CREATIONS ROOM™</title>
  <link rel="stylesheet" href="core.css" />
  <style>
    :root{
      --bg:#03070d;
      --panel:rgba(9,18,33,.88);
      --line:rgba(255,255,255,.08);
      --gold:#f1c76b;
      --gold2:#d89c31;
      --text:#fff4dd;
      --muted:rgba(255,255,255,.68);
      --shadow:0 24px 70px rgba(0,0,0,.45);
      --radius:24px;
      --maxw:1400px;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      background:#000;
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 50% 0%, rgba(241,199,107,.10), transparent 18%),
        linear-gradient(180deg,#01040a 0%, #06101a 100%);
    }

    .app{
      width:100%;
      max-width:var(--maxw);
      min-height:100vh;
      margin:0 auto;
      background:
        linear-gradient(180deg, rgba(2,6,14,.45), rgba(4,9,18,.94)),
        url('creations-bg.jpg') center center / cover no-repeat;
      box-shadow:var(--shadow);
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:40;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 18px;
      background:rgba(4,8,15,.86);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .topbtn{
      min-height:42px;
      padding:0 14px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
      font-weight:900;
    }

    .brand{
      flex:1;
      text-align:center;
    }

    .brand b{
      display:block;
      font-size:20px;
      color:#fff;
    }

    .brand span{
      display:block;
      margin-top:4px;
      font-size:12px;
      color:var(--muted);
    }

    .page{
      padding:18px;
      padding-bottom:110px;
    }

    .studio{
      display:grid;
      grid-template-columns:300px 1fr 300px;
      gap:16px;
    }

    .panel{
      border-radius:var(--radius);
      background:linear-gradient(180deg, rgba(10,19,36,.90), rgba(6,12,24,.94));
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel-head{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-size:15px;
      font-weight:1000;
      color:#fff;
    }

    .panel-body{
      padding:14px;
    }

    .center{
      border-radius:28px;
      background:linear-gradient(180deg, rgba(10,19,36,.92), rgba(5,11,22,.96));
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      min-height:680px;
      overflow:hidden;
    }

    .center-head{
      padding:16px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .center-head b{
      display:block;
      font-size:28px;
      color:#fff;
      margin-bottom:6px;
    }

    .center-head span{
      display:block;
      font-size:13px;
      color:var(--muted);
      line-height:1.6;
    }

    .center-body{
      padding:16px;
    }

    .bottom-dock{
      position:fixed;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:min(var(--maxw),100%);
      padding:12px 18px 16px;
      background:rgba(4,9,16,.92);
      backdrop-filter:blur(14px);
      border-top:1px solid rgba(255,255,255,.06);
    }

    .dock-grid{
      display:grid;
      grid-template-columns:repeat(6,1fr);
      gap:10px;
    }

    .dock-item{
      min-height:58px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      color:#f4dfb5;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:900;
      text-align:center;
    }

    .dock-item.primary{
      background:linear-gradient(180deg,var(--gold),var(--gold2));
      color:#1c1205;
      border:none;
    }

    @media (max-width:1100px){
      .studio{grid-template-columns:1fr}
    }

    @media (max-width:760px){
      .dock-grid{grid-template-columns:repeat(3,1fr)}
      .topbar{flex-wrap:wrap}
      .brand{width:100%;order:-1}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="topbtn">← Back</button>

      <div class="brand">
        <b>CREATIONS ROOM™</b>
        <span>Live Build • Inventors • Public Feedback • Protect • Value</span>
      </div>

      <button class="topbtn">☰ Menu</button>
    </header>

    <main class="page">
      <section class="studio">
        <aside class="panel">
          <div class="panel-head">AI ASSISTANT</div>
          <div class="panel-body">
            Tim ♥️ AI sẽ đứng ở đây.
          </div>
        </aside>

        <section class="center">
          <div class="center-head">
            <b>PROJECT BUILD CANVAS</b>
            <span>Chính giữa là vùng build project thật.</span>
          </div>
          <div class="center-body">
            Canvas trung tâm sẽ dựng ở bước 2.
          </div>
        </section>

        <aside class="panel">
          <div class="panel-head">TOOLS + ASSETS</div>
          <div class="panel-body">
            Tools sẽ dựng ở bước 4.
          </div>
        </aside>
      </section>
    </main>

    <div class="bottom-dock">
      <div class="dock-grid">
        <div class="dock-item">Home</div>
        <div class="dock-item">Network</div>
        <div class="dock-item">LICENSEGOC</div>
        <div class="dock-item">LCN</div>
        <div class="dock-item">AI TIM</div>
        <div class="dock-item primary">+ Create Project</div>
      </div>
    </div>
  </div>

  <script src="core.js"></script>
</body>
</html>
