<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREATIONS ROOM™ — LICENSEGOC</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#020814;
  color:#fff;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
  padding-bottom:100px;
}

.card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;
  padding:20px;
  margin-top:20px;
  text-align:center;
}

h1{
  margin:0 0 10px;
}

p{
  color:rgba(255,255,255,.7);
}

input, textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:#09111f;
  color:#fff;
}

textarea{
  min-height:100px;
}

.btn{
  margin-top:12px;
  padding:12px 16px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:900;
}

.gold{
  background:linear-gradient(180deg,#f1c76b,#d89c31);
  color:#1a1205;
}

.dark{
  background:rgba(255,255,255,.08);
  color:#fff;
}

</style>
</head>

<body>

<div class="container">

  <h1>CREATIONS ROOM™</h1>
  <p>Build project → Send to USPTO AI</p>

  <div class="card">

    <h2>PROJECT BUILD</h2>

    <input id="projectName" placeholder="Tên Project / Invention">

    <textarea id="projectIdea" placeholder="Mô tả ý tưởng"></textarea>

    <textarea id="projectProblem" placeholder="Vấn đề cần giải quyết"></textarea>

    <textarea id="projectSolution" placeholder="Giải pháp / cơ chế hoạt động"></textarea>

    <button class="btn gold" id="sendUSPTOBtn">
      ⚖️ Send to USPTO Prep
    </button>

  </div>

</div>
<script>
const sendUSPTOBtn = document.getElementById("sendUSPTOBtn");

sendUSPTOBtn.addEventListener("click", () => {
  const title = encodeURIComponent(
    document.getElementById("projectName").value.trim() || "Untitled Invention"
  );

  const idea = encodeURIComponent(
    document.getElementById("projectIdea").value.trim() || "Describe your invention."
  );

  const problem = encodeURIComponent(
    document.getElementById("projectProblem").value.trim() || "Problem being solved."
  );

  const solution = encodeURIComponent(
    document.getElementById("projectSolution").value.trim() || "Solution or mechanism needs to be described."
  );

  window.location.href =
    "uspto.html?title=" + title +
    "&idea=" + idea +
    "&problem=" + problem +
    "&solution=" + solution;
});
</script>

</body>
</html>
