<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREATOR LOGIN — LICENSEGOC™</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#000;
  color:#fff;
}
.page{
  min-height:100vh;
  padding:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.86)),
    url("creations-bg.jpg") center/cover no-repeat;
}
.card{
  width:min(460px,100%);
  border-radius:30px;
  padding:28px;
  background:rgba(5,10,18,.88);
  border:1px solid rgba(241,199,107,.22);
  backdrop-filter:blur(18px);
  box-shadow:0 24px 70px rgba(0,0,0,.5);
}
h1{
  color:#f1c76b;
  text-align:center;
  margin:0 0 10px;
}
p{
  text-align:center;
  color:rgba(255,255,255,.72);
  line-height:1.5;
}
input{
  width:100%;
  min-height:54px;
  margin-top:12px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.12);
  background:#07101d;
  color:#fff;
  padding:0 16px;
  font-size:15px;
}
button,a{
  width:100%;
  min-height:56px;
  margin-top:12px;
  border-radius:999px;
  border:none;
  font-weight:1000;
  font-size:15px;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.gold{
  background:linear-gradient(180deg,#f1c76b,#d89c31);
  color:#160d03;
}
.dark{
  background:rgba(255,255,255,.07);
  color:#f8dfaa;
  border:1px solid rgba(255,255,255,.12);
}
.translate{
  position:fixed;
  top:16px;
  right:16px;
  width:48px;
  height:48px;
  border-radius:50%;
}
.lang{
  position:fixed;
  top:76px;
  right:16px;
  display:none;
  background:#000;
  padding:10px;
  border-radius:14px;
}
</style>
</head>

<body>

<button class="gold translate" onclick="toggleLang()">🌍</button>
<div id="lang" class="lang">TRANSLATION READY</div>

<div class="page">
  <div class="card">
    <h1>CREATOR LOGIN</h1>
    <p>Login to access your LICENSEGOC™ Creator ID, projects, ownership records, USPTO drafts, and lifecycle history.</p>

    <input id="name" placeholder="Creator Name">
    <input id="email" placeholder="Email">

    <button class="gold" onclick="loginCreator()">LOGIN AS CREATOR</button>
    <button class="dark" onclick="loginVisitor()">CONTINUE AS VISITOR</button>
    <a class="dark" href="index.html">← BACK HOME</a>
  </div>
</div>

<script src="auth.js"></script>

<script>
function loginCreator(){
  const name=document.getElementById("name").value;
  const email=document.getElementById("email").value;

  if(!name){
    alert("Please enter creator name.");
    return;
  }

  gocLogin(name,email,"CREATOR");
  window.location.href="creator-dashboard.html";
}

function loginVisitor(){
  gocVisitor();
  window.location.href="system-map.html";
}

function toggleLang(){
  const box=document.getElementById("lang");
  box.style.display=box.style.display==="block"?"none":"block";
}
</script>

</body>
</html>
