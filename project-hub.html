<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT HUB™ — LICENSEGOC</title>

<style>
:root{
  --line:rgba(255,255,255,.1);
  --gold:#f1c76b;
  --green:#71f0ad;
  --muted:rgba(255,255,255,.7);
}
body{
  margin:0;
  font-family:Arial;
  background:radial-gradient(circle,#071326,#020814);
  color:#fff;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
  padding-bottom:100px;
}
.card{
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  background:rgba(255,255,255,.05);
  margin-bottom:16px;
}
.grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:16px;
}
img{
  width:100%;
  border-radius:16px;
  border:1px solid var(--line);
}
.stat{color:var(--muted);margin-top:6px}
.big{font-size:34px;font-weight:1000;color:var(--gold)}
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:1000;
  cursor:pointer;
}
.gold{background:var(--gold);color:#000}
.dark{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
.bar{
  height:10px;
  background:rgba(255,255,255,.1);
  border-radius:999px;
  overflow:hidden;
}
.fill{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--green));
}
@media(max-width:800px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<h1>🧩 PROJECT HUB™</h1>

<div class="grid">

<div class="card">
  <h2 id="projectTitle">—</h2>
  <p id="idea" class="stat"></p>
  <img id="img" src="" style="display:none">
</div>

<div class="card">
  <div class="stat" id="id"></div>
  <div class="stat" id="owner"></div>
  <div class="stat" id="status"></div>
  <div class="stat" id="created"></div>

  <div style="margin-top:16px">
    <div class="stat">Readiness</div>
    <div class="big" id="ready">0%</div>
    <div class="bar"><div id="bar" class="fill"></div></div>
  </div>

  <div style="margin-top:16px">
    <div class="stat">Estimated Value</div>
    <div class="big" id="value">$0</div>
  </div>
</div>

</div>

<div class="card">
  <h3>🚀 ACTIONS</h3>
  <button class="btn dark" onclick="goInvestor()">💼 Investor Snapshot</button>
  <button class="btn dark" onclick="goExport()">📤 Export Project</button>
  <button class="btn dark" onclick="goLog()">📜 Lifecycle Log</button>
  <button class="btn gold" onclick="goEdit()">🛠 Edit Project</button>
  <button class="btn dark" onclick="goAI()">🤖 AI</button>
  <button class="btn dark" onclick="goOwner()">📜 Ownership</button>
  <button class="btn dark" onclick="goUSPTO()">⚖️ USPTO</button>
  <button class="btn dark" onclick="goCoin()">🪙 Coin</button>
  <button class="btn dark" onclick="markProtected()">🛡 Mark Protected</button>
 <button class="btn dark" onclick="markPublished()">🌍 Mark Published</button>
  <button class="btn gold" onclick="goGlobal()">🌍 Global</button>
</div>

<div class="card">
  <h3>🧠 Tim ♥️ Analysis</h3>
  <p id="analysis" class="stat"></p>
</div>

</div>

<script>
let projects = JSON.parse(localStorage.getItem("projects") || "[]");
let index = Number(localStorage.getItem("openProjectIndex") || 0);
let p = projects[index];

if(!p){
  name.innerText="No Project Found";
}else{
  render();
}

function render(){
 document.getElementById("projectTitle").innerText = p.name  || "Untitled";
  idea.innerText = p.idea || "";

  if(p.image){
    img.src = p.image;
    img.style.display="block";
  }

  id.innerText = "Ghost ID: " + (p.id || "—");
  owner.innerText = "Owner: " + (p.owner || "—");
  status.innerText = "Status: " + (p.status || "Draft");
  created.innerText = "Created: " + (p.created || "");

  let r = calcReady();
  let v = calcValue();

  ready.innerText = r + "%";
  bar.style.width = r + "%";
  value.innerText = "$" + v.toLocaleString();

  analysis.innerText =
    "Project đã kết nối toàn hệ. Bước tiếp theo: hoàn thiện USPTO + Ownership + hình proof.";
}

function calcReady(){
  let r=20;
  if(p.idea)r+=15;
  if(p.problem)r+=15;
  if(p.solution)r+=20;
  if(p.image)r+=15;
  if(p.status==="Protected")r+=10;
  return Math.min(r,100);
}

function calcValue(){
  let v=1000;
  if(p.idea)v+=2000;
  if(p.problem)v+=2000;
  if(p.solution)v+=4000;
  if(p.image)v+=3000;
  if(p.status==="Protected")v+=10000;
  return v;
}
  function goInvestor(){location.href="investor-snapshot.html";}
function goExport(){location.href="export-project.html";}
function goLog(){location.href="project-log.html";}
function goEdit(){location.href="edit-project.html";}
function goAI(){window.location.href="ai-command.html";}
function goOwner(){window.location.href="ownership.html";}
function goUSPTO(){
  window.location.href="uspto.html?title="+encodeURIComponent(p.name||"")+
  "&idea="+encodeURIComponent(p.idea||"")+
  "&problem="+encodeURIComponent(p.problem||"")+
  "&solution="+encodeURIComponent(p.solution||"");
}
function goCoin(){window.location.href="licensecoin.html";}
function goGlobal(){window.location.href="globalroom.html";}
  function saveProject(){
  projects[index] = p;
  localStorage.setItem("projects", JSON.stringify(projects));
  window.dispatchEvent(new Event("licensegoc-sync"));
}

function addLog(action, detail){
  if(!p.logs) p.logs = [];
  p.logs.unshift({
    action: action,
    detail: detail,
    time: new Date().toLocaleString()
  });
}

function markProtected(){
  p.status = "Protected";
  p.protectedAt = new Date().toISOString();

  addLog(
    "PROJECT PROTECTED",
    "Project was marked as Protected from PROJECT HUB™."
  );

  saveProject();
  render();
  alert("Project marked as Protected.");
}

function markPublished(){
  p.status = "Published";
  p.publishedAt = new Date().toISOString();

  addLog(
    "PROJECT PUBLISHED",
    "Project was published from PROJECT HUB™."
  );

  saveProject();
  render();
  alert("Project marked as Published.");
}
</script>


<script src="sync.js"></script>
<script src="core.js"></script>
<script src="os.js"></script>
<script src="licensegoc-nav.js"></script>


</body>
</html>
