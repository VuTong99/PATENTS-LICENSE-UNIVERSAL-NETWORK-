<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT HUB™ — LICENSEGOC</title>

<style>
:root{
  --line:rgba(255,255,255,.1);
  --gold:#f1c76b;
  --green:#71f0ad;
  --cyan:#7ae7ff;
  --muted:rgba(255,255,255,.7);
}
body{
  margin:0;
  font-family:Arial;
  background:radial-gradient(circle,#071326,#020814);
  color:#fff;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:18px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;
}
.card{
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  background:rgba(255,255,255,.05);
  margin-top:16px;
}
.grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:16px;
}
.actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
}
.gold{background:var(--gold);color:#000}
.dark{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line)}
.stat{
  color:var(--muted);
  margin:8px 0;
}
.big{
  font-size:36px;
  font-weight:900;
  color:var(--gold);
}
img{
  width:100%;
  max-height:420px;
  object-fit:contain;
  border-radius:16px;
  background:#020814;
  border:1px solid var(--line);
}
.bar{
  height:10px;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
}
.fill{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--green));
}
@media(max-width:800px){
  .grid{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
  <h1>🧩 PROJECT HUB™</h1>
  <button class="btn dark" style="max-width:220px" onclick="goRoom()">← CreationsRoom</button>
</div>

<div class="grid">

  <div class="card">
    <h2 id="projectName">No Project Selected</h2>
    <p id="projectIdea" class="stat"></p>
    <div id="imageBox"></div>
  </div>

  <div class="card">
    <h2>📊 Project Signal</h2>
    <div class="stat" id="ghostId">Ghost ID: —</div>
    <div class="stat" id="owner">Owner: —</div>
    <div class="stat" id="status">Status: —</div>
    <div class="stat" id="created">Created: —</div>

    <div style="margin-top:18px">
      <div class="stat">Readiness</div>
      <div class="big" id="readiness">0%</div>
      <div class="bar"><div class="fill" id="readinessBar"></div></div>
    </div>

    <div style="margin-top:18px">
      <div class="stat">Estimated Value</div>
      <div class="big" id="value">$0</div>
    </div>
  </div>

</div>

<div class="card">
  <h2>🚀 Command Actions</h2>

  <div class="actions">
    <button class="btn gold" onclick="goAI()">🤖 AI Command</button>
    <button class="btn dark" onclick="goOwnership()">📜 Ownership</button>
    <button class="btn dark" onclick="goUSPTO()">⚖️ USPTO Prep</button>
    <button class="btn dark" onclick="goCoin()">🪙 LICENSECOIN Engine</button>
    <button class="btn dark" onclick="goGlobal()">🌍 GlobalRoom</button>
    <button class="btn gold" onclick="markReview()">✅ Mark Review Ready</button>
  </div>
</div>

<div class="card">
  <h2>🧠 Tim ♥️ Hub Analysis</h2>
  <div id="analysis" class="stat"></div>
</div>

</div>

<script>
let projects = JSON.parse(localStorage.getItem("projects")||"[]");
let index = Number(localStorage.getItem("openProjectIndex")||0);
let p = projects[index];

if(!p){
  document.getElementById("projectName").innerText="No project found.";
}else{
  if(!p.id)p.id="GOC-"+Math.random().toString(36).substring(2,8).toUpperCase();
  render();
}

function save(){
  localStorage.setItem("projects",JSON.stringify(projects));
}

function calcReadiness(){
  let score=20;
  if(p.idea)score+=15;
  if(p.problem)score+=15;
  if(p.solution)score+=20;
  if(p.image)score+=15;
  if(p.status==="Protected")score+=10;
  if(p.status==="Published")score+=10;
  return Math.min(score,100);
}

function calcValue(){
  let v=1000;
  if(p.idea)v+=p.idea.length*25;
  if(p.problem)v+=2500;
  if(p.solution)v+=4000;
  if(p.image)v+=3000;
  if(p.status==="Protected")v+=10000;
  if(p.status==="Published")v+=15000;
  if(p.members)v+=p.members.length*1000;
  return Math.round(v);
}

function render(){
  const r=calcReadiness();
  const v=calcValue();

  p.value=v;
  save();

  projectName.innerText=p.name||"Untitled Project";
  projectIdea.innerText=p.idea||"No idea description yet.";
  ghostId.innerText="Ghost ID: "+p.id;
  owner.innerText="Owner: "+(p.owner||"Unknown");
  status.innerText="Status: "+(p.status||"Draft");
  created.innerText="Created: "+(p.created||"Unknown");

  readiness.innerText=r+"%";
  readinessBar.style.width=r+"%";
  value.innerText="$"+v.toLocaleString();

  imageBox.innerHTML=p.image ? `<img src="${p.image}">` : `<div class="stat">No project image uploaded.</div>`;

  analysis.innerText =
    "Tim ♥️: This hub connects the project core to AI, ownership, USPTO, LICENSECOIN, and GlobalRoom. Next strongest move is to complete proof visuals and legal readiness before public monetization.";
}

function markReview(){
  p.status="Review Ready";
  save();
  render();
}

function goRoom(){window.location.href="creationsroom.html"}
function goGlobal(){window.location.href="globalroom.html"}

function goAI(){
  localStorage.setItem("openProjectIndex", index);
  window.location.href="ai-command.html";
}

function goOwnership(){
  localStorage.setItem("openProjectIndex", index);
  window.location.href="ownership.html";
}

function goCoin(){
  localStorage.setItem("openProjectIndex", index);
  window.location.href="licensecoin-engine.html";
}

function goUSPTO(){
  window.location.href =
    "uspto.html?title="+encodeURIComponent(p.name||"")+
    "&idea="+encodeURIComponent(p.idea||"")+
    "&problem="+encodeURIComponent(p.problem||"")+
    "&solution="+encodeURIComponent(p.solution||"");
}
</script>

</body>
</html>
