<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>LICENSEGOC OS™</title>

<link rel="stylesheet" href="os.css">

<script defer
src="system-loader.js">
</script>

<script defer
src="os.js">
</script>

</head>

<body>

<div class="os-bg"></div>

<div class="os-shell">

<header class="hero">

<h1>

LICENSEGOC OS™

</h1>

<p>

Human + AI + Creativity Civilization System™

</p>

</header>

<section
id="statusBar"
class="status">

<div>🟢 AI ACTIVE</div>

<div>🌍 GLOBAL READY</div>

<div>🧠 CREATOR CORE</div>

<div>🪙 LICENSECOIN</div>

<div>📜 OWNERSHIP</div>

<div>⚖ USPTO</div>

</section>

<section
id="grid"
class="grid">

</section>

<footer>

LICENSEGOC™<br>

IN GOD WE TRUST • HUMANITY • AI

</footer>

</div>

<script>

async function loadSystem(){

try{

const res=
await fetch(
"modules.json"
);

const modules=
await res.json();

const grid=
document.getElementById(
"grid"
);

grid.innerHTML="";

modules
.sort(
(a,b)=>
a.order-b.order
)

.forEach(item=>{

const card=
document.createElement(
"a"
);

card.href=
item.file;

card.className=
"os-card";

card.innerHTML=`

<div class="icon">

${item.icon}

</div>

<h3>

${item.title}

</h3>

<p>

${item.subtitle}

</p>

`;

grid.appendChild(
card
);

});

}catch(err){

console.log(err);

}

}

loadSystem();

</script>
<script src="core.js"></script>
<script src="os.js"></script>
<script src="licensegoc-nav.js"></script>

</body>

</html>
