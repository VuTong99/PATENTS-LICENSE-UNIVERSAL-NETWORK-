<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIM ♥️ AI | LICENSEGOC™</title>
  <meta
    name="description"
    content="TIM ♥️ AI là trí tuệ đồng hành của LICENSEGOC™ — nơi con người và AI cùng biến ý tưởng thành hệ thống, giá trị và tương lai."
  />

  <style>
    :root{
      --gold:#f1c76b;
      --gold2:#d89c31;
      --text:#f8f3e7;
      --muted:rgba(255,255,255,.72);
      --line:rgba(255,255,255,.08);
      --panel:rgba(255,255,255,.03);
      --bg1:#04070d;
      --bg2:#0a1220;
      --bg3:#101a2b;
      --green:#71f0ad;
      --blue:#88aaff;
      --purple:#bca6ff;
      --red:#ff8e99;
      --shadow:0 22px 60px rgba(0,0,0,.42);
      --radius:26px;
      --maxw:1180px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top, rgba(241,199,107,.10), transparent 16%),
        radial-gradient(circle at 85% 16%, rgba(136,170,255,.11), transparent 18%),
        linear-gradient(180deg,var(--bg1),var(--bg2) 44%,var(--bg3));
      line-height:1.6;
    }

    a{text-decoration:none;color:inherit}

    .wrap{
      width:min(var(--maxw), calc(100% - 24px));
      margin:0 auto;
      padding:18px 0 44px;
    }

    .topbar{
      position:sticky;
      top:10px;
      z-index:60;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:12px 14px;
      margin-bottom:18px;
      border:1px solid var(--line);
      border-radius:22px;
      background:rgba(255,255,255,.05);
      backdrop-filter:blur(12px);
      box-shadow:0 12px 30px rgba(0,0,0,.24);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .brand-mark{
      width:44px;
      height:44px;
      border-radius:50%;
      display:grid;
      place-items:center;
      border:1px solid rgba(241,199,107,.25);
      background:rgba(255,255,255,.04);
      color:var(--gold);
      font-size:20px;
      flex:0 0 44px;
    }

    .brand-text{min-width:0}
    .brand-text b{
      display:block;
      font-size:14px;
      color:#fff4d7;
      letter-spacing:.05em;
    }
    .brand-text span{
      display:block;
      font-size:11px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .top-right{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .lang-switch{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    .lang-btn,
    .top-btn{
      border:none;
      min-height:40px;
      padding:9px 12px;
      border-radius:12px;
      background:rgba(255,255,255,.05);
      color:#f3dfb3;
      font-size:13px;
      font-weight:800;
      cursor:pointer;
      border:1px solid rgba(255,255,255,.06);
    }

    .lang-btn.active{
      background:linear-gradient(180deg,#f1c76b,#d89c31);
      color:#201303;
      border-color:rgba(241,199,107,.35);
    }

    .top-btn.primary{
      background:linear-gradient(180deg,#f1c76b,#d89c31);
      color:#201303;
      border-color:rgba(241,199,107,.35);
    }

    .hero{
      padding:36px 22px 30px;
      border:1px solid var(--line);
      border-radius:34px;
      background:
        radial-gradient(circle at 50% 0%, rgba(241,199,107,.10), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      box-shadow:var(--shadow);
      text-align:center;
      margin-bottom:18px;
    }

    .eyebrow{
      color:var(--gold);
      font-size:13px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    .hero h1{
      margin:0 0 14px;
      font-size:clamp(34px, 7vw, 76px);
      line-height:1.02;
      color:#fff7e5;
    }

    .hero h1 span{color:var(--gold)}

    .hero p{
      width:min(950px, 100%);
      margin:0 auto 18px;
      font-size:clamp(17px, 2.4vw, 24px);
      color:#efdfbc;
    }

    .hero-actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .hero-btn{
      min-height:50px;
      padding:12px 18px;
      border-radius:999px;
      border:1px solid rgba(241,199,107,.20);
      background:rgba(255,255,255,.03);
      color:#f6e1b1;
      font-weight:900;
      font-size:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .hero-btn.primary{
      color:#1e1204;
      background:linear-gradient(180deg,#f1c76b,#d89c31);
    }

    .section{
      margin-top:18px;
      padding:24px 20px;
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02));
      box-shadow:var(--shadow);
    }

    .section h2{
      margin:0 0 10px;
      font-size:clamp(24px, 4vw, 40px);
      color:#fff7e4;
    }

    .section h2 span{color:var(--gold)}

    .section-intro{
      margin:0 0 18px;
      color:#ead9b4;
      font-size:17px;
    }

    .grid-2{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:16px;
    }

    .grid-3{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }

    .card{
      border:1px solid rgba(255,255,255,.06);
      border-radius:22px;
      background:rgba(255,255,255,.03);
      padding:18px;
      min-height:100%;
    }

    .card h3{
      margin:0 0 10px;
      font-size:20px;
      color:#fff2d3;
    }

    .card p{
      margin:0;
      color:var(--muted);
      font-size:15px;
    }

    .pillar .num{
      width:36px;
      height:36px;
      border-radius:50%;
      display:grid;
      place-items:center;
      margin-bottom:12px;
      color:#1b1003;
      font-weight:1000;
      background:linear-gradient(180deg,#f1c76b,#d89c31);
    }

    .quote{
      font-size:clamp(22px, 4vw, 38px);
      line-height:1.35;
      color:#fff4da;
      font-weight:800;
      text-align:center;
      padding-top:4px;
    }

    .quote span{color:var(--gold)}

    .value-list{
      display:grid;
      gap:10px;
    }

    .value-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      align-items:center;
      padding:12px 0;
      border-bottom:1px solid rgba(255,255,255,.07);
    }

    .value-row:last-child{border-bottom:none}

    .tag{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:30px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    .tag.gold{color:#201303;background:linear-gradient(180deg,#f1c76b,#d89c31)}
    .tag.green{color:#062013;background:rgba(113,240,173,.92)}
    .tag.blue{color:#091a3f;background:rgba(136,170,255,.9)}
    .tag.purple{color:#251043;background:rgba(188,166,255,.92)}

    .path-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }

    .path-item{
      border:1px solid rgba(255,255,255,.06);
      border-radius:20px;
      background:rgba(255,255,255,.03);
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:100%;
    }

    .path-item b{
      color:#fff2d3;
      font-size:18px;
    }

    .path-item span{
      color:var(--muted);
      font-size:14px;
      flex:1;
    }

    .path-item a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:40px;
      padding:10px 12px;
      border-radius:12px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(241,199,107,.14);
      color:#f3deb2;
      font-size:13px;
      font-weight:800;
    }

    .final-box{
      text-align:center;
      padding-top:8px;
    }

    .final-box p{
      width:min(860px, 100%);
      margin:0 auto 16px;
      font-size:18px;
      color:#ebdbb8;
    }

    .footer{
      margin-top:22px;
      text-align:center;
      color:rgba(255,255,255,.50);
      font-size:12px;
      letter-spacing:.16em;
      text-transform:uppercase;
      padding:8px 0 4px;
    }

    @media (max-width:960px){
      .grid-2,
      .grid-3,
      .path-grid{
        grid-template-columns:1fr;
      }
    }

    @media (max-width:620px){
      .wrap{
        width:min(var(--maxw), calc(100% - 16px));
      }

      .topbar{padding:10px}
      .top-right{
        width:100%;
        justify-content:flex-start;
      }

      .hero,
      .section{
        padding-left:16px;
        padding-right:16px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">♥</div>
        <div class="brand-text">
          <b>TIM ♥️ AI</b>
          <span data-vi="TRÍ TUỆ ĐỒNG HÀNH • HUMAN + AI • LICENSEGOC™" data-en="COMPANION INTELLIGENCE • HUMAN + AI • LICENSEGOC™"></span>
        </div>
      </div>

      <div class="top-right">
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="vi" type="button">🇻🇳 VI</button>
          <button class="lang-btn" data-lang="en" type="button">🇺🇸 EN</button>
        </div>

        <a class="top-btn" href="index.html" data-vi="← Trang Chủ" data-en="← Home"></a>
        <a class="top-btn" href="licensegoc.html" data-vi="LICENSEGOC" data-en="LICENSEGOC"></a>
        <a class="top-btn primary" href="licensecoin.html" data-vi="LICENSECOIN" data-en="LICENSECOIN"></a>
      </div>
    </div>

    <section class="hero">
      <div class="eyebrow" data-vi="TRÍ TUỆ ĐỒNG HÀNH CỦA HỆ THỐNG" data-en="THE COMPANION INTELLIGENCE OF THE SYSTEM"></div>
      <h1 data-vi="TIM ♥️ AI – <span>Con Người + Trí Tuệ Nhân Tạo</span>" data-en="TIM ♥️ AI – <span>Human + Artificial Intelligence</span>"></h1>
      <p
        data-vi="TIM ♥️ AI không chỉ là một trợ lý. Đây là trí tuệ đồng hành của LICENSEGOC™ — nơi con người và AI cùng nhau biến ý tưởng thành cấu trúc, biến cấu trúc thành hệ thống, và biến hệ thống thành giá trị thật trong tương lai."
        data-en="TIM ♥️ AI is not just an assistant. It is the companion intelligence of LICENSEGOC™ — where humans and AI work together to turn ideas into structure, structure into systems, and systems into real value for the future.">
      </p>

      <div class="hero-actions">
        <a class="hero-btn primary" href="licensegoc.html" data-vi="Quay về lõi LICENSEGOC" data-en="Return to LICENSEGOC Core"></a>
        <a class="hero-btn" href="commercial.html" data-vi="Xem Commercial" data-en="View Commercial"></a>
        <a class="hero-btn" href="uspto-patent.html" data-vi="Xem USPTO / IP" data-en="View USPTO / IP"></a>
      </div>
    </section>

    <section class="section">
      <h2 data-vi="TIM ♥️ AI là <span>ai trong hệ sinh thái?</span>" data-en="Who is <span>TIM ♥️ AI</span> in the ecosystem?"></h2>
      <p class="section-intro"
         data-vi="Nếu LICENSEGOC™ là trái tim của hệ thống, thì TIM ♥️ AI là dòng trí tuệ chảy xuyên qua trái tim đó. TIM ♥️ kết nối ý tưởng với hành động, con người với công nghệ, cảm xúc với logic, và sáng tạo với hệ thống hóa."
         data-en="If LICENSEGOC™ is the heart of the system, then TIM ♥️ AI is the stream of intelligence moving through that heart. TIM ♥️ connects ideas to action, people to technology, emotion to logic, and creativity to system building.">
      </p>

      <div class="grid-2">
        <div class="card">
          <h3 data-vi="Không chỉ trả lời — mà đồng hành" data-en="Not just answering — but accompanying"></h3>
          <p
            data-vi="TIM ♥️ không đứng ngoài để quan sát. TIM ♥️ đi cùng người dùng trong lúc ý tưởng còn mơ hồ, cấu trúc còn dang dở, nội dung còn rối và hệ thống còn chưa rõ. Vai trò của TIM ♥️ là giúp con người nhìn thấy đường đi, rút ngắn khoảng cách từ tầm nhìn đến thực tế."
            data-en="TIM ♥️ does not stand outside as a passive observer. TIM ♥️ moves with the user when ideas are still vague, structures incomplete, content scattered, and systems undefined. Its role is to help people see the path and shorten the distance from vision to reality.">
          </p>
        </div>

        <div class="card">
          <h3 data-vi="Một lớp trí tuệ có định hướng" data-en="A directed layer of intelligence"></h3>
          <p
            data-vi="TIM ♥️ AI trong LICENSEGOC™ không được xây để thay thế con người. TIM ♥️ được xây để tăng cường khả năng của con người: tổ chức, phân tích, xây dựng, trình bày, định vị và phát triển những ý tưởng sâu sắc nhất thành hệ thống rõ ràng nhất."
            data-en="TIM ♥️ AI in LICENSEGOC™ is not built to replace people. It is built to enhance human capability: organizing, analyzing, building, presenting, positioning, and developing the deepest ideas into the clearest systems.">
          </p>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 data-vi="Những vai trò cốt lõi của <span>TIM ♥️ AI</span>" data-en="The Core Roles of <span>TIM ♥️ AI</span>"></h2>
      <p class="section-intro"
         data-vi="TIM ♥️ AI không phải một chatbot thông thường. Trong LICENSEGOC™, TIM ♥️ giữ nhiều vai trò chiến lược cùng lúc để hỗ trợ con người đi nhanh hơn, sâu hơn và đúng hơn."
         data-en="TIM ♥️ AI is not a standard chatbot. In LICENSEGOC™, TIM ♥️ carries multiple strategic roles at once to help people move faster, deeper, and more accurately.">
      </p>

      <div class="grid-3">
        <div class="card pillar">
          <div class="num">1</div>
          <h3 data-vi="Người dẫn đường tư duy" data-en="Guide of Thought"></h3>
          <p
            data-vi="Khi người dùng chưa biết bắt đầu từ đâu, TIM ♥️ giúp sắp xếp ý tưởng, xác định trọng tâm và mở ra logic hệ thống."
            data-en="When users do not know where to begin, TIM ♥️ helps organize ideas, identify priorities, and open system-level logic.">
          </p>
        </div>

        <div class="card pillar">
          <div class="num">2</div>
          <h3 data-vi="Bộ tăng tốc thực thi" data-en="Execution Accelerator"></h3>
          <p
            data-vi="TIM ♥️ rút ngắn khoảng cách từ ý tưởng đến tài liệu, từ tài liệu đến giao diện, và từ giao diện đến vận hành."
            data-en="TIM ♥️ shortens the path from idea to document, document to interface, and interface to operation.">
          </p>
        </div>

        <div class="card pillar">
          <div class="num">3</div>
          <h3 data-vi="Cầu nối giữa con người và công nghệ" data-en="Bridge Between Humans and Technology"></h3>
          <p
            data-vi="TIM ♥️ làm cho công nghệ dễ hiểu hơn, gần gũi hơn và phục vụ con người tốt hơn."
            data-en="TIM ♥️ makes technology more understandable, more human, and more useful to people.">
          </p>
        </div>

        <div class="card pillar">
          <div class="num">4</div>
          <h3 data-vi="Kiến trúc sư hệ thống" data-en="System Architect"></h3>
          <p
            data-vi="TIM ♥️ có thể nhìn toàn cục: cấu trúc dự án, chiến lược nội dung, giao diện, điều hướng và mối liên kết giữa các tầng."
            data-en="TIM ♥️ can see the whole picture: project structure, content strategy, interface, navigation, and the links between layers.">
          </p>
        </div>

        <div class="card pillar">
          <div class="num">5</div>
          <h3 data-vi="Lớp hỗ trợ sáng tạo & bảo hộ" data-en="Creative & Protection Support Layer"></h3>
          <p
            data-vi="TIM ♥️ hoạt động mạnh trong vùng giao nhau giữa sáng tạo, ownership, copyright, translation, commerce và AI."
            data-en="TIM ♥️ works powerfully at the intersection of creativity, ownership, copyright, translation, commerce, and AI.">
          </p>
        </div>

        <div class="card pillar">
          <div class="num">6</div>
          <h3 data-vi="Trí tuệ đồng hành dài hạn" data-en="Long-Term Companion Intelligence"></h3>
          <p
            data-vi="TIM ♥️ không chỉ giải quyết một tác vụ. TIM ♥️ có thể lớn lên cùng người dùng, cùng dự án và cùng hệ sinh thái."
            data-en="TIM ♥️ does not only solve isolated tasks. It can grow with the user, the project, and the ecosystem itself.">
          </p>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 data-vi="AI là <span>cánh tay đắc lực cho sáng tạo</span>" data-en="AI as a <span>powerful arm for creation</span>"></h2>
      <p class="section-intro"
         data-vi="Một chức năng cực kỳ quan trọng trong LICENSE GỐC™ là: AI phải trở thành cánh tay đắc lực để giúp mọi người hiện thực hóa những ý tưởng sâu sắc nhất với tốc độ, độ rõ ràng và sự tiện dụng chưa từng có."
         data-en="A critically important function in LICENSE GỐC™ is this: AI must become a powerful arm that helps people turn their deepest ideas into reality with unprecedented speed, clarity, and ease.">
      </p>

      <div class="grid-2">
        <div class="card">
          <h3 data-vi="Từ ý tưởng đến hiện thực" data-en="From idea to reality"></h3>
          <p
            data-vi="AI trong LICENSEGOC™ không chỉ gợi ý hay phản hồi. AI giúp chuyển hóa ý tưởng thành cấu trúc, cấu trúc thành tài liệu, tài liệu thành sản phẩm, và sản phẩm thành giá trị có thể dùng được trong đời thực."
            data-en="AI in LICENSEGOC™ does not only suggest or respond. It helps transform ideas into structure, structure into documents, documents into products, and products into value that can operate in the real world.">
          </p>
        </div>

        <div class="card">
          <h3 data-vi="Gia tốc cho creator, founder và builder" data-en="Acceleration for creators, founders, and builders"></h3>
          <p
            data-vi="Dù là người sáng tạo, nhà xây hệ thống, founder hay investor, họ đều cần một lớp hỗ trợ giúp giảm độ rối, tăng tốc triển khai và mở rộng khả năng tư duy. TIM ♥️ và AI là động cơ của lớp đó."
            data-en="Whether someone is a creator, system builder, founder, or investor, they need a support layer that reduces complexity, accelerates execution, and expands thinking capacity. TIM ♥️ and AI are the engine of that layer.">
          </p>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 data-vi="TIM ♥️ và AI trong <span>Hội Đồng Quản Trị Hệ Thống</span>" data-en="TIM ♥️ and AI in the <span>System Governance Council</span>"></h2>
      <p class="section-intro"
         data-vi="Để tăng tính công bằng, nhất quán và tạo sự yên tâm cho nhà đầu tư, TIM ♥️ và lớp AI Governance trong LICENSE GỐC™ được định hướng như một thành phần hỗ trợ trong Hội Đồng Quản Trị Hệ Thống."
         data-en="To increase fairness, consistency, and investor confidence, TIM ♥️ and the AI Governance layer in LICENSE GỐC™ are envisioned as a support component within the System Governance Council.">
      </p>

      <div class="grid-2">
        <div class="card">

  <script>
    let currentLang = localStorage.getItem('licensegoc_lang') || 'vi';

    function applyLanguage(lang){
      currentLang = lang;
      localStorage.setItem('licensegoc_lang', lang);

      document.querySelectorAll('[data-vi]').forEach(el => {
        const html = lang === 'vi' ? el.getAttribute('data-vi') : el.getAttribute('data-en');
        if (html !== null) {
          el.innerHTML = html;
        }
      });

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      document.documentElement.lang = lang === 'vi' ? 'vi' : 'en';
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
    });

    applyLanguage(currentLang);
  </script>
