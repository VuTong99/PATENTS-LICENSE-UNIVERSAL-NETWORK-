<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USPTO AI FINAL CHECK™ — LICENSEGOC</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#020814;
  color:#fff;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
  padding-bottom:100px;
}
.card{
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:16px;
  margin-bottom:16px;
  background:rgba(255,255,255,.05);
}
input,textarea,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:#09111f;
  color:#fff;
}
textarea{min-height:100px}
.btn{
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:900;
}
.gold{background:#f1c76b;color:#000}
.dark{background:rgba(255,255,255,.08);color:#fff}
.output{
  white-space:pre-wrap;
  margin-top:12px;
  padding:12px;
  background:#09111f;
  border-radius:12px;
}
.score{
  font-size:32px;
  color:#f1c76b;
  font-weight:900;
}
</style>
</head>

<body>

<div class="container">

<h1>⚖️ USPTO AI FINAL CHECK™</h1>

<div class="card">
<h2>Patent Builder</h2>

<input id="title" placeholder="Title">
<textarea id="idea" placeholder="Idea"></textarea>
<textarea id="problem" placeholder="Problem"></textarea>
<textarea id="solution" placeholder="Solution"></textarea>

<button class="btn gold" onclick="generateDraft()">Generate Draft</button>
<div id="draft" class="output"></div>
</div>

<div class="card">
<h2>AI Final Check</h2>

<button class="btn gold" onclick="finalCheck()">Run AI Check</button>
<div class="score" id="score">0%</div>
<div id="check" class="output"></div>
</div>

<div class="card">
<h2>Attorney Review</h2>

<button class="btn gold" onclick="attorney()">Run Review</button>
<button class="btn dark" onclick="claims()">Generate Claims</button>

<div id="attorneyOut" class="output"></div>
</div>

<div class="card">
<h2>Navigation</h2>

<button class="btn dark" onclick="goHub()">Project Hub</button>
<button class="btn dark" onclick="goOwner()">Ownership</button>
<button class="btn dark" onclick="goCoin()">LicenseCoin</button>
<button class="btn gold" onclick="goGlobal()">Global</button>

<button class="btn gold" onclick="window.open('https://patentcenter.uspto.gov/','_blank')">
Open USPTO Official
</button>
</div>

</div>

<script>
let projects = JSON.parse(localStorage.getItem("projects")||"[]");
let index = Number(localStorage.getItem("openProjectIndex")||0);
let p = projects[index];
function saveProjectLog(action, detail){
  if(!p) return;

  if(!p.logs) p.logs = [];

  p.logs.unshift({
    action: action,
    detail: detail,
    time: new Date().toLocaleString()
  });

  localStorage.setItem("projects", JSON.stringify(projects));
}
if(p){
  title.value = p.name || "";
  idea.value = p.idea || "";
  problem.value = p.problem || "";
  solution.value = p.solution || "";
}

function generateDraft(){
  draft.innerText =
`TITLE:
${title.value}

ABSTRACT:
${idea.value}

PROBLEM:
${problem.value}

SOLUTION:
${solution.value}

CLAIM:
A system configured to perform the described function.`;
  saveProjectLog("USPTO CLAIMS GENERATED", "Claims draft was generated.");
}

function finalCheck(){
  let s=0;
  if(title.value.length>5)s+=20;
  if(idea.value.length>30)s+=20;
  if(problem.value.length>20)s+=20;
  if(solution.value.length>30)s+=20;
  if(draft.innerText.length>100)s+=20;

  score.innerText = s+"%";

  check.innerText =
  s>80 ? "Ready for USPTO" :
  s>60 ? "Need improvement" :
  "Not ready";
}

function attorney(){
  attorneyOut.innerText =
  "Tim ♥️: Hồ sơ có thể nộp dạng Utility Patent. Nên mở rộng claims và thêm drawings.";
}

function claims(){
  attorneyOut.innerText =
`CLAIMS:

1. A system comprising components configured to perform the invention.

2. The system improves efficiency by the described mechanism.

3. Includes alternative embodiments and scalable architecture.`;
}

function goHub(){location.href="project-hub.html"}
function goOwner(){location.href="ownership.html"}
function goCoin(){location.href="licensecoin-engine.html"}
function goGlobal(){location.href="globalroom.html"}
</script>
<script src="sync.js"></script>
<script src="nav.js"></script>

</body>
</html>
